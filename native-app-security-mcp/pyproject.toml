[project]
name = "native-app-security-mcp"
version = "0.5.0"
description = "Evidence-oriented static analysis for native Android and iOS packages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0"]

[project.scripts]
native-app-security = "native_security.cli:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/native_security"]

[tool.uv]
package = true
