services:
  mcp:
    build: .
    restart: unless-stopped
    init: true
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Run npm run configure -- your-domain first}
      MCP_PUBLIC_URL: https://${MCP_DOMAIN:?Set MCP_DOMAIN}/mcp
    expose:
      - "3000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?Set MCP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      mcp:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
